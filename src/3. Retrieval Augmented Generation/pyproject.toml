    "langchain-community==0.3.22",
    "langchain-core==0.3.55",
    "langchain-text-splitters==0.3.8",
    "langchain-openai==0.3.11",
    "langchain-chroma==0.2.3",
    "langchain-experimental>=0.3.0",
    "faiss-cpu>=1.12.0",
    "python-dotenv>=1.1.0",
    "pypdf>=5.4.0",
    "reportlab>=4.4.4",
    "requests>=2.32.3",
    "beautifulsoup4>=4.13.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=3.0,<5",
    "ragas>=0.3.5",
    "neo4j>=5.28.2",
    "chromadb>=0.6.3",
    "langchain-neo4j<0.5",
    "pydantic>=2.11.4",
    "faker>=37.8.0",
    "markdown>=3.9",
    "weasyprint>=66.0",
